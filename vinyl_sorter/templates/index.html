<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinylSorter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/coverflow.css">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title">VinylSorter</h1>
        <p class="site-subtitle" id="stats-subtitle">Loading collection…</p>
        <div class="view-toggle" id="view-toggle">
            <button class="view-toggle-btn active" data-view="grid" id="btn-grid">Grid</button>
            <button class="view-toggle-btn" data-view="flow" id="btn-flow">Flow</button>
        </div>
        <div class="sort-toggle" id="sort-toggle">
            <button class="sort-toggle-btn active" data-sort="original" id="btn-sort-original">Original Sort</button>
            <button class="sort-toggle-btn" data-sort="year" id="btn-sort-year">Year</button>
            <button class="sort-toggle-btn" data-sort="added" id="btn-sort-added">Date Added</button>
        </div>
        <div class="sort-toggle" id="sort-direction">
            <button class="sort-toggle-btn sort-direction-btn" id="btn-sort-direction" type="button" data-direction="asc" aria-label="Sort ascending" title="Sort ascending">
                <svg class="sort-dir-icon sort-dir-asc" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="M11 12h4"/><path d="M11 16h7"/><path d="M11 20h10"/></svg>
                <svg class="sort-dir-icon sort-dir-desc" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/></svg>
            </button>
        </div>
    </header>

    <main id="collection-container">
        <div class="loading" id="loading-spinner">
            <div class="spinner"></div>
            <p>Loading your collection…</p>
        </div>
    </main>

    <!-- Cover Flow view -->
    <div class="coverflow-container" id="coverflow-container"></div>

    <!-- Detail modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
            <div class="modal-content">
                <div class="modal-cover">
                    <img id="modal-cover-img" src="" alt="Album cover">
                </div>
                <div class="modal-info">
                    <p class="modal-sort-num" id="modal-sort-num"></p>
                    <h2 class="modal-title" id="modal-title"></h2>
                    <p class="modal-artist" id="modal-artist"></p>
                    <p class="modal-year" id="modal-year"></p>
                    <p class="modal-sort-details" id="modal-sort-details"></p>
                    <div class="modal-badges" id="modal-badges"></div>
                    <div class="modal-actions">
                        <a class="modal-action-btn" id="modal-discogs-link" href="#" target="_blank" rel="noopener noreferrer">
                            <svg class="modal-action-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 0 1 6.32 12.9l-2.6-3.6a4 4 0 0 0-1.42-5.3l1.06-1.7A8 8 0 0 1 12 4Zm-6.32 3.1 2.6 3.6a4 4 0 0 0 1.42 5.3l-1.06 1.7A8 8 0 0 1 5.68 7.1ZM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/>
                            </svg>
                            <span>View on Discogs</span>
                            <svg class="modal-action-external" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3ZM5 5h6v2H7v10h10v-4h2v6H5V5Z"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/coverflow.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
